<body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// Bad Math — DECODED: Theranos $100M vs $100K. Every frame is a pure function of t.
const W = 1080, H = 1920, DUR = 54.08;
const C = document.getElementById('c'), X = C.getContext('2d');
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const O = OFF.getContext('2d');
const TMP = document.createElement('canvas'); TMP.width = W; TMP.height = H; const T = TMP.getContext('2d');
const INK = '#0B0F14', RED = '#FF3B30', GREEN = '#00D26A', PAPER = '#F5F3EE', HL = '#FFD60A', STEEL = '#5b6573', DARK = '#151b23';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), ei = x => Math.pow(clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- primitives ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(c, s, x, y, font, color, align = 'center', base = 'middle') { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function glowTxt(c, s, x, y, font, color, blur) { c.save(); c.shadowColor = color; c.shadowBlur = blur; txt(c, s, x, y, font, color); c.restore(); }
function stamp(c, s, x, y, size, color, rot, k) {
  if (k <= 0) return;
  const sc = lerp(2.6, 1, back(k)); c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc); c.globalAlpha = clamp(k * 3);
  c.font = `400 ${size}px Anton`; const w = c.measureText(s).width + size * .6, h = size * 1.25;
  c.fillStyle = 'rgba(11,15,20,.78)'; rr(c, -w / 2, -h / 2, w, h, size * .12); c.fill();
  c.strokeStyle = color; c.lineWidth = size * .09; rr(c, -w / 2, -h / 2, w, h, size * .12); c.stroke();
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, 0, size * .04); c.restore();
}
function bgGrid(c, t, tint = 'rgba(255,59,48,.05)') { c.fillStyle = INK; c.fillRect(0, 0, W, H); c.strokeStyle = tint; c.lineWidth = 2; const o = (t * 30) % 90; for (let x = -90 + o; x < W; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = -90 + o; y < H; y += 90) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } }
function vignette(c, a = .7) { const g = c.createRadialGradient(540, 900, 300, 540, 900, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function bill(c, x, y, w, rot, a = 1) { c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = a; rr(c, -w / 2, -w * .24, w, w * .48, 5); c.fillStyle = '#1f8f55'; c.fill(); c.strokeStyle = '#7ef0b0'; c.lineWidth = 3; c.stroke(); c.beginPath(); c.arc(0, 0, w * .13, 0, 7); c.stroke(); c.restore(); }
function silhouette(c, cx, cy, s, color) { c.save(); c.fillStyle = color; c.beginPath(); c.arc(cx, cy - s * .55, s * .26, 0, 7); c.fill(); c.beginPath(); c.moveTo(cx - s * .6, cy + s * .55); c.quadraticCurveTo(cx - s * .6, cy - s * .15, cx, cy - s * .2); c.quadraticCurveTo(cx + s * .6, cy - s * .15, cx + s * .6, cy + s * .55); c.closePath(); c.fill(); c.restore(); }
function building(c, x, y, w, h, label, col, t, lit = 1) {
  c.save(); const g = c.createLinearGradient(x, y, x + w, y); g.addColorStop(0, '#1d242e'); g.addColorStop(.5, '#2f3946'); g.addColorStop(1, '#1d242e'); rr(c, x, y, w, h, 10); c.fillStyle = g; c.fill();
  c.strokeStyle = col; c.lineWidth = 4; rr(c, x, y, w, h, 10); c.stroke();
  for (let r = 0; r < 7; r++) for (let q = 0; q < 3; q++) { const on = hash(r * 3 + q + Math.floor(t * 2 + r) * .3) > .35; c.fillStyle = on ? `rgba(255,214,10,${.75 * lit})` : 'rgba(255,255,255,.07)'; c.fillRect(x + 30 + q * ((w - 60) / 3), y + 90 + r * ((h - 130) / 7), (w - 60) / 3 - 14, (h - 130) / 7 - 16); }
  rr(c, x - 6, y - 56, w + 12, 66, 8); c.fillStyle = col; c.fill(); txt(c, label, x + w / 2, y - 22, '400 44px Anton', INK); c.restore();
}
function vault(c, x, y, w, h, level, label, t, labelCol = PAPER) {
  c.save(); const sg = c.createLinearGradient(x, y, x + w, y + h); sg.addColorStop(0, '#46505d'); sg.addColorStop(.5, '#2b333d'); sg.addColorStop(1, '#4a5461');
  rr(c, x, y, w, h, 28); c.fillStyle = sg; c.fill(); c.strokeStyle = '#7d8896'; c.lineWidth = 5; c.stroke();
  const ix = x + w * .08, iy = y + h * .2, iw = w * .84, ih = h * .66;
  rr(c, ix, iy, iw, ih, 14); c.fillStyle = '#080b0f'; c.fill(); c.save(); rr(c, ix, iy, iw, ih, 14); c.clip();
  const top = iy + ih * (1 - level); const cols = 5, bw = iw / cols;
  for (let q = 0; q < cols; q++) for (let r = 0; r < 12; r++) { const by = iy + ih - (r + 1) * (ih / 12); if (by + ih / 12 <= top - 2) continue; const wob = Math.sin(t * 6 + q * 2 + r) * 1.5; c.fillStyle = (r + q) % 2 ? '#1f8f55' : '#27a862'; c.fillRect(ix + q * bw + 4 + wob, Math.max(by, top) + 3, bw - 8, ih / 12 - 6); }
  c.restore();
  for (const [bx, by] of [[x + 22, y + 22], [x + w - 22, y + 22], [x + 22, y + h - 22], [x + w - 22, y + h - 22]]) { c.fillStyle = '#9aa5b3'; c.beginPath(); c.arc(bx, by, 8, 0, 7); c.fill(); }
  rr(c, x + w * .12, y - 26, w * .76, 62, 8); c.fillStyle = '#0B0F14'; c.fill(); c.strokeStyle = labelCol; c.lineWidth = 4; c.stroke(); txt(c, label, x + w / 2, y + 6, '400 40px Anton', labelCol);
  c.restore();
}
function plane(c, x, y, ang, s) { c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s); c.fillStyle = PAPER; c.beginPath(); c.moveTo(40, 0); c.lineTo(-36, -26); c.lineTo(-14, 0); c.lineTo(-36, 26); c.closePath(); c.fill(); c.strokeStyle = '#9aa5b3'; c.lineWidth = 3; c.beginPath(); c.moveTo(40, 0); c.lineTo(-14, 0); c.lineTo(-24, 14); c.stroke(); c.restore(); }
function heart(c, x, y, s, col, a = 1) { c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = a; c.fillStyle = col; c.beginPath(); c.moveTo(0, 30); c.bezierCurveTo(-60, -10, -30, -52, 0, -22); c.bezierCurveTo(30, -52, 60, -10, 0, 30); c.fill(); c.restore(); }

// ---------- captions (from words.json) ----------
const CAPS = (() => {
  const toks = WORDS.map(w => ({ w: w.w, s: w.s, e: w.e }));
  const groups = []; let g = [];
  for (const k of toks) { const prev = g[g.length - 1]; if (g.length && (g.length >= 4 || g.reduce((a, x) => a + x.w.length + 1, 0) + k.w.length > 18 || /[,.?!]$/.test(prev.w) || k.s - prev.e > .5)) { groups.push(g); g = []; } g.push(k); }
  if (g.length) groups.push(g);
  const GRN = ['million', 'billion', 'billionaire', '700', '100'], REDW = ['inaccurate', 'voided', 'guilty', 'prison', 'counts', 'real', 'problem', 'the problem', 'thousand'],
    YEL = ['shameless', 'like', 'send', 'follow', 'theranos', 'edison', 'forbes', 'invested', 'claimed', '11'];
  return groups.map((gr, i) => ({
    s: gr[0].s - .03, e: groups[i + 1] ? groups[i + 1][0].s - .03 : gr[gr.length - 1].e + .3,
    parts: gr.map(k => { const raw = k.w.replace(/[,.?!]+$/, '').toUpperCase(); const lo = raw.toLowerCase().replace(/'s$/, ''); const col = (raw === '$100,000' || raw === '100,000') ? RED : (raw.startsWith('$') || GRN.includes(lo)) ? GREEN : REDW.includes(lo) ? RED : YEL.includes(lo) ? HL : PAPER; return [raw, col]; })
  }));
})();
function caption(c, t) {
  const cp = CAPS.find(x => t >= x.s && t < x.e); if (!cp) return;
  const k = eo(lin(t, cp.s, cp.s + .1)), parts = cp.parts;
  c.save(); c.font = '800 68px Inter'; const sp = c.measureText(' ').width;
  const lines = [[]]; let lw = 0; for (const p of parts) { const w = c.measureText(p[0]).width; if (lw + w > 600 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([...p, w]); lw += w + sp; }
  const y0 = 1345 - (lines.length - 1) * 40; c.translate(420, y0); c.scale(.8 + .2 * k, .8 + .2 * k); c.globalAlpha = k;
  lines.forEach((ln, li) => { const tw = ln.reduce((a, p) => a + p[2], 0) + sp * (ln.length - 1); let px = -tw / 2;
    for (const [w, col, ww] of ln) { c.textAlign = 'left'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = 'rgba(0,0,0,.85)'; c.lineJoin = 'round'; c.strokeText(w, px, li * 84); c.fillStyle = col; c.fillText(w, px, li * 84); px += ww + sp; } });
  c.restore();
}
function hud(c, t) {
  c.save(); rr(c, 90, 238, 196, 52, 8); c.fillStyle = RED; c.fill(); txt(c, 'DECODED', 188, 265, '800 30px Inter', PAPER);
  txt(c, 'CASE: THERANOS · 2014–2018', 306, 265, '700 27px JBM', 'rgba(245,243,238,.8)', 'left');
  txt(c, 'CONVICTED 2022 · 11 YRS 3 MOS · SOURCES: SEC, WSJ, WIKIPEDIA', 90, 1492, '700 18px JBM', 'rgba(245,243,238,.62)', 'left');
  c.fillStyle = 'rgba(245,243,238,.15)'; c.fillRect(90, 306, 900, 6); c.fillStyle = RED; c.fillRect(90, 306, 900 * t / DUR, 6);
  c.restore();
}

// ---------- Theranos scenes ----------
function wordmark(c, x, y, size, k = 1, col = PAPER) { c.save(); c.translate(x, y); const sc = lerp(2.4, 1, back(k)); c.scale(sc, sc); c.globalAlpha = clamp(k * 3); c.letterSpacing = (size * .12) + 'px'; txt(c, 'THERANOS', 0, 0, `400 ${size}px Anton`, col); c.letterSpacing = '0px'; c.restore(); }
function mstamp(c, lines, x, y, size, color, rot, k) { // multi-line stamp
  if (k <= 0) return; const sc = lerp(2.6, 1, back(k)); c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc); c.globalAlpha = clamp(k * 3); c.font = `400 ${size}px Anton`;
  const w = Math.max(...lines.map(l => c.measureText(l).width)) + size * .7, h = lines.length * size * 1.12 + size * .35;
  c.fillStyle = 'rgba(11,15,20,.82)'; rr(c, -w / 2, -h / 2, w, h, size * .12); c.fill(); c.strokeStyle = color; c.lineWidth = size * .08; rr(c, -w / 2, -h / 2, w, h, size * .12); c.stroke();
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; lines.forEach((l, i) => c.fillText(l, 0, (i - (lines.length - 1) / 2) * size * 1.12 + size * .03)); c.restore();
}
function edison(c, x, y, w, h, t, o = {}) { // sleek box machine
  c.save(); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 40; c.shadowOffsetY = 18;
  const g = c.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#f4f6f9'); g.addColorStop(.55, '#cfd6df'); g.addColorStop(1, '#8f9aa8'); rr(c, x, y, w, h, 36); c.fillStyle = g; c.fill(); c.restore();
  c.save(); rr(c, x + w * .3, y - 10, w * .4, 22, 10); c.fillStyle = '#10151c'; c.fill(); c.restore(); // slot
  rr(c, x + w * .1, y + h * .12, w * .8, h * .22, 14); c.fillStyle = '#10151c'; c.fill(); txt(c, 'EDISON', x + w / 2, y + h * .23, `400 ${Math.round(h * .16)}px Anton`, o.hi ? HL : PAPER);
  rr(c, x + w * .12, y + h * .42, w * .5, h * .4, 16); c.fillStyle = '#0a2a2a'; c.fill(); c.strokeStyle = '#37505a'; c.lineWidth = 3; c.stroke();
  txt(c, o.screen || 'READY', x + w * .37, y + h * .62, `800 ${Math.round(h * .09)}px JBM`, o.scol || GREEN);
  c.fillStyle = (Math.sin(t * 8) > 0 ? GREEN : '#1f6f45'); c.beginPath(); c.arc(x + w * .78, y + h * .52, 10, 0, 7); c.fill(); c.fillStyle = '#6b7684'; c.beginPath(); c.arc(x + w * .78, y + h * .68, 10, 0, 7); c.fill();
}
function stack(c, x, y, s, a = 1) { c.save(); c.globalAlpha = a; for (let i = 0; i < 3; i++) bill(c, x, y - i * 14 * s, 96 * s, (i - 1) * .05, 1); c.fillStyle = '#e8efe9'; c.fillRect(x - 10 * s, y - 36 * s, 20 * s, 44 * s); c.restore(); }
function magnifier(c, x, y, r) { c.save(); c.lineCap = 'round'; c.strokeStyle = '#5b3a1c'; c.lineWidth = 34; c.beginPath(); c.moveTo(x + r * .72, y + r * .72); c.lineTo(x + r * 1.55, y + r * 1.55); c.stroke(); c.strokeStyle = '#c3cad4'; c.lineWidth = 20; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); c.restore(); }
function hlabel(c, s, x, y, col = 'rgba(245,243,238,.8)', size = 30) { txt(c, s, x, y, `700 ${size}px JBM`, col); }

// A: 0–7.6 hook: revenue billboard + crash
const CRASH = 5.92;
function sHook(c, t) {
  const crashed = t >= CRASH, ck = ei(lin(t, CRASH, CRASH + .22));
  bgGrid(c, t, crashed ? 'rgba(255,59,48,.09)' : 'rgba(0,210,106,.08)');
  const gl = c.createRadialGradient(540, 640, 40, 540, 640, 600); gl.addColorStop(0, crashed ? 'rgba(255,59,48,.22)' : 'rgba(0,210,106,.28)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = gl; c.fillRect(0, 320, W, 700);
  txt(c, crashed ? 'REAL REVENUE' : 'CLAIMED REVENUE', 540, 390, '400 84px Anton', PAPER);
  const am = back(lin(t, -.25, .2)); const pulse = 1 + (t > 3.86 && t < 4.4 ? .06 * Math.sin(lin(t, 3.86, 4.4) * Math.PI) : 0);
  c.save(); c.translate(540, 530); c.scale((.92 + .08 * am) * pulse, (.92 + .08 * am) * pulse);
  if (!crashed) glowTxt(c, '$100,000,000', 0, 0, '800 112px JBM', GREEN, 50 + 20 * Math.sin(t * 9)); else glowTxt(c, '$100,000', 0, 0, '800 124px JBM', RED, 40); c.restore();
  // chart panel
  const px = 110, py = 640, pw = 860, ph = 560, base = py + ph - 50;
  rr(c, px, py, pw, ph, 22); c.fillStyle = 'rgba(16,22,30,.88)'; c.fill(); c.strokeStyle = crashed ? 'rgba(255,59,48,.7)' : 'rgba(0,210,106,.7)'; c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(245,243,238,.14)'; c.lineWidth = 2; for (let i = 0; i < 4; i++) { const gy = base - i * 125; c.beginPath(); c.moveTo(px + 140, gy); c.lineTo(px + pw - 30, gy); c.stroke(); txt(c, ['$0', '$33M', '$66M', '$100M'][i], px + 125, gy, '700 22px JBM', 'rgba(245,243,238,.5)', 'right'); }
  const full = 3 * 125, grow = 1; const bh = Math.max(7, full * (.12 + .88 * grow) * (1 - ck) + 7 * ck) ; // sliver after crash
  const bx = px + 360, bw = 260; const wob = !crashed ? Math.sin(t * 5) * 3 : 0;
  c.save(); c.shadowColor = crashed ? RED : GREEN; c.shadowBlur = crashed ? 20 : 40; const bg = c.createLinearGradient(0, base - bh, 0, base); bg.addColorStop(0, crashed ? '#ff6a5f' : '#7ef0b0'); bg.addColorStop(1, crashed ? RED : '#0f8f4d'); c.fillStyle = bg; rr(c, bx, base - bh + wob, bw, bh - wob, 10); c.fill(); c.restore();
  txt(c, crashed ? 'ACTUAL' : 'CLAIMED', bx + bw / 2, base + 30, '700 26px JBM', crashed ? RED : GREEN);
  if (crashed) { for (let i = 0; i < 6; i++) { const k = lin(t, CRASH, CRASH + .8); const fx = bx + 30 + hash(i) * 200, fy = base - 40 - k * (60 + hash(i + 9) * 180) + k * k * 160; c.fillStyle = `rgba(255,59,48,${1 - k})`; c.fillRect(fx, fy, 14, 14); } }
  // investors (2.1+)
  for (let i = 0; i < 3; i++) { const k = back(lin(t, 2.1 + i * .22, 2.4 + i * .22)) * (1 - ck); if (k > 0) { c.save(); c.translate(px + 70 + i * 0, 0); silhouette(c, px + 90 + (i % 2) * 36, py + 330 + i * 60 - 20, 62 * k, '#3a4452'); c.restore(); if (t > 3.86 && t < CRASH) { const f = lin(t, 3.86 + i * .15, 4.9 + i * .15); c.globalAlpha = (1 - f) * .9; txt(c, '$', px + 90 + (i % 2) * 36, py + 270 + i * 60 - f * 90, '800 40px JBM', GREEN); c.globalAlpha = 1; } } }
  stamp(c, 'SHAMELESS', 720, 770, 96, HL, .12, lin(t, .9, 1.04) * (1 - ck));
  // after crash
  if (crashed) { const lk = back(lin(t, 6.3, 6.55)); c.save(); c.translate(540, 900); c.rotate(-.05); c.scale(lk, lk); glowTxt(c, '1,000× LIE', 0, 0, '400 150px Anton', HL, 40); c.restore();
    hlabel(c, '$100,000,000 ÷ $100,000 = 1,000', 540, 1010, 'rgba(245,243,238,.85)', 28); }
}
// B: 7.6–14.2 wordmark + founder + blood drop
function sIntro(c, t) {
  bgGrid(c, t, 'rgba(255,59,48,.06)');
  wordmark(c, 540, 430, 130, lin(t, 7.66, 7.86));
  c.save(); c.globalAlpha = lin(t, 7.9, 8.1); c.fillStyle = RED; c.fillRect(270, 515, 540 * eo(lin(t, 7.9, 8.4)), 6); c.restore();
  const ck = back(lin(t, 9.1, 9.45)); if (ck > 0) { c.save(); c.translate(280 - (1 - ck) * 500, 760); c.rotate(-.03); rr(c, -190, -150, 380, 300, 22); c.fillStyle = '#1a212b'; c.fill(); c.strokeStyle = '#3a434f'; c.lineWidth = 4; c.stroke();
  rr(c, -150, -125, 300, 140, 16); c.fillStyle = '#232c38'; c.fill(); silhouette(c, 0, -35, 112, '#4a5565'); txt(c, 'ELIZABETH HOLMES', 0, 44, '400 38px Anton', PAPER); txt(c, 'FOUNDER', 0, 88, '700 30px JBM', HL); txt(c, 'NO PHOTO · ILLUSTRATION', 0, 124, '700 17px JBM', 'rgba(245,243,238,.45)'); c.restore(); }
  const mk = back(lin(t, 10.3, 10.7)); const bx = 540, by = 930 + (1 - mk) * 400;
  const hit = t > 12.1, hk = lin(t, 12.1, 12.7);
  if (mk > 0) edison(c, bx, by, 360, 300, t, { screen: hit ? 'RUNNING…' : 'READY', hi: t > 13.4 && t < 14.0, scol: hit ? HL : GREEN });
  const fk = eo(lin(t, 10.5, 10.9)); if (fk > 0) { c.save(); c.translate(720 + (1 - fk) * 420, 600); c.fillStyle = '#e1ad8c'; rr(c, -38, -90, 76, 200, 38); c.fill(); c.strokeStyle = '#b98568'; c.lineWidth = 3; c.beginPath(); c.moveTo(-18, 70); c.lineTo(18, 70); c.stroke(); c.restore(); }
  const swell = lin(t, 11.0, 11.7), fall = ei(lin(t, 11.7, 12.1));
  if (t >= 11.0 && t < 12.1) { const dy = lerp(722, 915, fall), r = (6 + 12 * swell) * (1 - fall * .15); c.save(); c.fillStyle = '#d4121f'; c.shadowColor = RED; c.shadowBlur = 16; c.beginPath(); c.arc(720, dy, r, 0, 7); c.moveTo(720, dy - r * 2.2 * (1 - fall * .5)); c.lineTo(720 - r * .9, dy - r * .3); c.lineTo(720 + r * .9, dy - r * .3); c.fill(); c.restore(); }
  if (hit && hk < 1) { c.strokeStyle = `rgba(255,59,48,${1 - hk})`; c.lineWidth = 5; c.beginPath(); c.ellipse(720, by + 2, 20 + hk * 90, 6 + hk * 18, 0, 0, 7); c.stroke(); }
  if (t > 13.4) { const k = back(lin(t, 13.4, 13.7)); c.save(); c.translate(720, 870); c.scale(k, k); txt(c, '"ONE FINGER PRICK"', 0, 0, '700 24px JBM', HL); c.restore(); }
}
// C: 14.2–20.3 money pours in + valuation rockets
function sMoney(c, t) {
  bgGrid(c, t, 'rgba(0,210,106,.06)');
  const cnt = lerp(0, 700e6, eo(lin(t, 14.5, 16.1))); const done = t > 16.1;
  c.save(); c.translate(450, 420); const pk = done ? 1 + .08 * Math.sin(lin(t, 16.1, 16.5) * Math.PI) : 1; c.scale(pk, pk); glowTxt(c, '$' + fmt(cnt) + (done ? '+' : ''), 0, 0, '800 78px JBM', GREEN, 25); c.restore();
