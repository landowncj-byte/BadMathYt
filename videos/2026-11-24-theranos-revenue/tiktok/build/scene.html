// "$100 million" -> $100,000,000, "$100 ,000" -> $100,000, "$9 billion" -> $9B, "11 years" -> 11 YRS
function fixTT(toks) {
  const o = [];
  for (let i = 0; i < toks.length; i++) {
    const k = { ...toks[i] }, n = toks[i + 1], p = (s => (s.match(/[,.?!]+$/) || [''])[0]);
    if (k.w === '$100' && n && /^million/i.test(n.w)) { k.w = '$100,000,000' + p(n.w); k.e = n.e; i++; }
    else if (k.w === '$100' && n && /^,000/.test(n.w)) { k.w = '$100,000' + p(n.w); k.e = n.e; i++; }
    else if (k.w === '$9' && n && /^billion/i.test(n.w)) { k.w = '$9B' + p(n.w); k.e = n.e; i++; }
    else if (k.w === '11' && n && /^years/i.test(n.w)) { k.w = '11 YRS' + p(n.w); k.e = n.e; i++; }
    o.push(k);
  }
  return o;
}
