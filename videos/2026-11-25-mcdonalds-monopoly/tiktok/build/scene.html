function hud(c, t) { c.save(); hudTop(c, 250); txt(c, FOOT_TXT, 90, 1478, '700 21px JBM', 'rgba(245,243,238,.62)', 'left'); c.restore(); }

const bounceY = (t, t0) => t >= t0 ? -30 * Math.max(0, 1 - (t - t0) / .25) : 0;

  big(c, 'IMAGINE BEING THE', 510, 395, 98, PAPER, 1, -.01, 0, 900); big(c, 'SECURITY GUY…', 510, 520, 130, RED, 1, .01, 30, 900); c.restore();

const SCENES = [[0, 1.9, sHook], [1.9, 3.7, sCup], [3.7, 5.2, sPile], [5.2, 6.9, sYears], [6.9, 8.7, sJac], [8.7, 10.2, sEnvA], [10.2, 12.2, sEnvB], [12.2, 14.1, sNet], [14.1, 16.3, sCut], [16.3, 18.0, sFbi], [18.0, 20.5, sBig], [20.5, 22.8, sCal], [22.8, 25.4, sCal], [25.4, 27.3, sConv], [27.3, 29.1, sMonths], [29.1, 31.1, sVote], [31.1, 32.9, sComment], [32.9, 99, (c, t) => sHook(c, .45 + (t - 32.9))]];
