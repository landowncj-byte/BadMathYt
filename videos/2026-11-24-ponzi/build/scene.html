// Bad Math — DECODED: Charles Ponzi (1920). Every frame is a pure function of t.
const W = 1080, H = 1920, DUR = 42.0;
const C = document.getElementById('c'), X = C.getContext('2d');
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const O = OFF.getContext('2d');
const TMP = document.createElement('canvas'); TMP.width = W; TMP.height = H; const T = TMP.getContext('2d');
const INK = '#0B0F14', RED = '#FF3B30', GREEN = '#00D26A', PAPER = '#F5F3EE', HL = '#FFD60A';
const SEP = '#E6D5B0', SEP2 = '#C9B07E', BRN = '#2B1D0E', BRN2 = '#5A3F1E';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(c, s, x, y, font, color, align = 'center', base = 'middle') { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function stamp(c, s, x, y, size, color, rot, k, font = 'Anton') {

  c.strokeStyle = color; c.lineWidth = size * .09; rr(c, -w / 2, -h / 2, w, h, size * .12); c.stroke();

}
// 1920s man silhouette (bowler hat). col: fill color
function man(c, x, y, s, col, opts = {}) {
  const { walk = 0, arms = 0, run = 0 } = opts; c.fillStyle = col;
  const sw = Math.sin(walk) * (run ? .5 : .25);

  c.save(); c.translate(s * .08, -s * .42); c.rotate(-sw); c.fillRect(-s * .06, 0, s * .12, s * .42); c.restore();
  rr(c, -s * .2, -s * .9, s * .4, s * .52, s * .08); c.fill();
  c.save(); c.translate(-s * .2, -s * .85); c.rotate(.15 + (arms ? -2.6 : -sw * .8)); c.fillRect(-s * .05, 0, s * .1, s * .4); c.restore();

  c.restore();
}
function bank(c, x, y, s, color) {

  c.fillRect(x - s * .55, y + s * .32, s * 1.1, s * .1);
}

  c.fillStyle = col; c.fillRect(-w / 2, -h / 2, w, h); c.strokeStyle = BRN2; c.lineWidth = Math.max(1, w * .03); c.setLineDash([w * .05, w * .04]); c.strokeRect(-w / 2 + w * .05, -h / 2 + w * .05, w - w * .1, h - w * .1); c.setLineDash([]);

function sepiaBg(c, t) { const g = c.createRadialGradient(540, 900, 200, 540, 900, 1300); g.addColorStop(0, '#3a2a14'); g.addColorStop(1, '#120c05'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function film(c, t, a = 1) { // grain, scratches, flicker over sepia scenes
  const f = Math.floor(t * 24); c.save(); c.globalAlpha = a;
  c.fillStyle = `rgba(255,240,200,${.04 + .04 * hash(f)})`; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 3; i++) if (hash(f * 3 + i) > .5) { const x = hash(f * 7 + i) * W; c.fillStyle = 'rgba(255,245,220,.25)'; c.fillRect(x, 0, 2, H); }
  for (let i = 0; i < 120; i++) { c.fillStyle = `rgba(0,0,0,${hash(f * 11 + i) * .25})`; c.fillRect(hash(f * 13 + i) * W, hash(f * 17 + i) * H, 3, 3); }
  if (hash(f * 5) > .85) { c.fillStyle = 'rgba(20,10,0,.6)'; c.beginPath(); c.arc(hash(f * 19) * W, hash(f * 23) * H, 6 + hash(f) * 14, 0, 7); c.fill(); }
  c.restore();
}
function bgGrid(c, t, tint = 'rgba(255,59,48,.05)') { c.fillStyle = INK; c.fillRect(0, 0, W, H); c.strokeStyle = tint; c.lineWidth = 2; const o = (t * 30) % 90; for (let x = -90 + o; x < W; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = -90 + o; y < H; y += 90) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } }
function vignette(c, a = .7) { const g = c.createRadialGradient(540, 900, 300, 540, 900, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }

  txt(c, 'NEEDED', 350, 1260, '400 44px Rye', SEP2); txt(c, '160,000,000', 350, 760, '800 44px JBM', 'rgba(230,213,176,.55)');
  const real = 880 * 27000 / 160e6; // ~0.15 px
