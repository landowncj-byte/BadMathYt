<script>
// Bad Math — DECODED: The Great Salad Oil Swindle (1963). Every frame is a pure function of t.
const W = 1080, H = 1920, DUR = 42.6;
const C = document.getElementById('c'), X = C.getContext('2d');
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const O = OFF.getContext('2d');
const TMP = document.createElement('canvas'); TMP.width = W; TMP.height = H; const T = TMP.getContext('2d');
const INK = '#0B0F14', RED = '#FF3B30', GREEN = '#00D26A', PAPER = '#F5F3EE', HL = '#FFD60A';
const OIL1 = '#FFC83D', OIL2 = '#D98A00', WAT1 = '#2B8CE0', WAT2 = '#0A3460';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), ei = x => Math.pow(clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- primitives ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(c, s, x, y, font, color, align = 'center', base = 'middle') { c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function stamp(c, s, x, y, size, color, rot, k) {           // k: 0..1 slam-in
  if (k <= 0) return;
  const sc = lerp(2.6, 1, back(k)); c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc); c.globalAlpha = clamp(k * 3);
  c.font = `400 ${size}px Anton`; const w = c.measureText(s).width + size * .6, h = size * 1.25;
  c.strokeStyle = color; c.lineWidth = size * .09; rr(c, -w / 2, -h / 2, w, h, size * .12); c.stroke();
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(s, 0, size * .04); c.restore();
}
// cutaway storage tank. fill = total liquid level 0..1, oil = fraction of the liquid that is oil (on top)
function tank(c, x, y, w, h, o) {
  const { fill = 1, oil = 1, xray = 0, t = 0, label = null, glow = 0, compartment = 0, bubbles = 1, labelColor = PAPER } = o;
  c.save();
  if (glow > 0) { const g = c.createRadialGradient(x + w / 2, y + h / 2, 10, x + w / 2, y + h / 2, w); g.addColorStop(0, `rgba(255,200,61,${.35 * glow})`); g.addColorStop(1, 'rgba(255,200,61,0)'); c.fillStyle = g; c.fillRect(x - w, y - h * .5, w * 3, h * 2); }
  // body shell
  const r = w * .1;
  const sg = c.createLinearGradient(x, 0, x + w, 0);
  sg.addColorStop(0, '#2a323d'); sg.addColorStop(.18, '#5b6573'); sg.addColorStop(.5, '#3a434f'); sg.addColorStop(.85, '#5b6573'); sg.addColorStop(1, '#1d232b');
  rr(c, x, y, w, h, [r * 1.6, r * 1.6, r * .4, r * .4]); c.fillStyle = sg; c.fill();
  // interior window
  const ix = x + w * .07, iy = y + h * .06, iw = w * .86, ih = h * .9;
  c.save(); rr(c, ix, iy, iw, ih, [r, r, r * .3, r * .3]); c.clip();
  c.fillStyle = '#0d1117'; c.fillRect(ix, iy, iw, ih);
  const lvl = iy + ih * (1 - fill), oilTop = lvl, oilBot = lvl + ih * fill * oil;
  const wave = (px, amp, ph) => Math.sin(px * .018 + t * 3.1 + ph) * amp + Math.sin(px * .041 - t * 2.3) * amp * .5;
  // water (below)
  if (oil < 1 && fill > 0) {
    const wg = c.createLinearGradient(0, oilBot, 0, iy + ih); wg.addColorStop(0, WAT1); wg.addColorStop(1, WAT2);
    c.fillStyle = wg; c.beginPath(); c.moveTo(ix, iy + ih);
    for (let px = 0; px <= iw; px += 12) c.lineTo(ix + px, oilBot + wave(px, 4, 1.7));
    c.lineTo(ix + iw, iy + ih); c.closePath(); c.fill();
    if (bubbles) for (let i = 0; i < 26; i++) { const bx = ix + hash(i) * iw, sp = 40 + hash(i + 9) * 80, by = iy + ih - ((t * sp + hash(i + 3) * ih) % Math.max(10, (iy + ih - oilBot))); if (by > oilBot + 6) { c.beginPath(); c.arc(bx + Math.sin(t * 3 + i) * 5, by, 3 + hash(i + 5) * 7, 0, 7); c.strokeStyle = 'rgba(200,235,255,.5)'; c.lineWidth = 2; c.stroke(); } }
  }
  // oil (top layer)
  if (oil > 0 && fill > 0) {
    const og = c.createLinearGradient(0, oilTop, 0, oilBot + 2); og.addColorStop(0, OIL1); og.addColorStop(1, OIL2);
    c.fillStyle = og; c.beginPath(); c.moveTo(ix, oilBot + wave(0, 4, 1.7));
    for (let px = 0; px <= iw; px += 12) c.lineTo(ix + px, oilTop + wave(px, 7, 0));
    for (let px = iw; px >= 0; px -= 12) c.lineTo(ix + px, oilBot + (oil < 1 ? wave(px, 4, 1.7) : 40));
    c.closePath(); c.fill();
    c.globalAlpha = .35; c.fillStyle = '#fff6d0'; for (let i = 0; i < 4; i++) { c.fillRect(ix + iw * (.1 + i * .22) + Math.sin(t * 2 + i) * 20, oilTop + 14 + i * 6, iw * .1, 4); } c.globalAlpha = 1;
  }
  if (compartment > 0) { // hidden inner compartment under the hatch: a narrow tube of oil
    const cw = iw * .26, cx = ix + iw / 2 - cw / 2;
    c.globalAlpha = compartment; c.fillStyle = OIL2; c.fillRect(cx, iy, cw, ih * .55);
    c.fillStyle = OIL1; c.fillRect(cx + 6, iy, cw - 12, ih * .55);
    c.setLineDash([18, 12]); c.lineDashOffset = -t * 60; c.strokeStyle = RED; c.lineWidth = 8; c.strokeRect(cx - 4, iy - 10, cw + 8, ih * .55 + 14); c.setLineDash([]); c.globalAlpha = 1;
  }
  if (xray > 0) { c.globalAlpha = xray * .25; c.fillStyle = '#7fd4ff'; for (let yy = iy; yy < iy + ih; yy += 10) c.fillRect(ix, yy + (t * 80 % 10), iw, 2); c.globalAlpha = 1; }
  c.restore();
  // rim, rivets, hatch
  c.strokeStyle = '#8b96a5'; c.lineWidth = 6; rr(c, x, y, w, h, [r * 1.6, r * 1.6, r * .4, r * .4]); c.stroke();
  c.fillStyle = '#1d232b'; for (let i = 0; i < 7; i++) { c.beginPath(); c.arc(x + w * .035, y + h * (.12 + i * .13), 5, 0, 7); c.fill(); c.beginPath(); c.arc(x + w * .965, y + h * (.12 + i * .13), 5, 0, 7); c.fill(); }
  rr(c, x + w * .38, y - h * .045, w * .24, h * .06, 8); c.fillStyle = '#5b6573'; c.fill();
  if (label) { c.font = `800 ${Math.round(w * .085)}px JBM`; const tw = c.measureText(label).width + 30; rr(c, x + w / 2 - tw / 2, y + h + 18, tw, w * .14, 10); c.fillStyle = 'rgba(11,15,20,.85)'; c.fill(); txt(c, label, x + w / 2, y + h + 18 + w * .07, `800 ${Math.round(w * .085)}px JBM`, labelColor); }
  c.restore();
}
function bank(c, x, y, s, color) {
  c.fillStyle = color; c.beginPath(); c.moveTo(x - s * .55, y - s * .25); c.lineTo(x, y - s * .55); c.lineTo(x + s * .55, y - s * .25); c.closePath(); c.fill();
  for (let i = 0; i < 4; i++) c.fillRect(x - s * .42 + i * s * .26, y - s * .2, s * .1, s * .5);
  c.fillRect(x - s * .55, y + s * .32, s * 1.1, s * .1);
}
function bill(c, x, y, w, rot, a = 1) { c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = a; rr(c, -w / 2, -w * .21, w, w * .42, 4); c.fillStyle = '#cfe3c6'; c.fill(); c.strokeStyle = '#2f6a3a'; c.lineWidth = w * .05; c.stroke(); c.beginPath(); c.ellipse(0, 0, w * .12, w * .15, 0, 0, 7); c.fillStyle = '#3d7a46'; c.fill(); c.restore(); }
function person(c, x, y, s, color, light = 0, t = 0) { // inspector silhouette
  c.fillStyle = color; c.beginPath(); c.arc(x, y - s * .78, s * .16, 0, 7); c.fill();
  rr(c, x - s * .22, y - s * .58, s * .44, s * .58, s * .12); c.fill();
  c.fillRect(x - s * .2, y - s * .04, s * .14, s * .36); c.fillRect(x + s * .06, y - s * .04, s * .14, s * .36);
  rr(c, x - s * .26, y - s * .92, s * .52, s * .08, 4); c.fill(); rr(c, x - s * .16, y - s * 1.02, s * .32, s * .14, 6); c.fill(); // hat
  if (light > 0) { c.save(); c.globalAlpha = light * .55; const g = c.createLinearGradient(x, y - s * .3, x + s * 1.4, y + s * 1.6); g.addColorStop(0, 'rgba(255,240,180,.95)'); g.addColorStop(1, 'rgba(255,240,180,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(x + s * .25, y - s * .35); c.lineTo(x + s * 1.6 + Math.sin(t * 2) * 30, y + s * 1.9); c.lineTo(x + s * .4, y + s * 2.0); c.closePath(); c.fill(); c.restore(); }
}
function paper(c, x, y, w, h, rot, f) { c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 40; c.shadowOffsetY = 20; c.fillStyle = '#efe6cf'; c.fillRect(-w / 2, -h / 2, w, h); c.shadowColor = 'transparent'; f(c, w, h); c.restore(); }

// ---------- captions (from the real voiceover word timings) ----------
const CAPS = [[0, 'THIS TANK IS'], [0.91, 'FULL OF <g>SALAD OIL.</g>'], [2.41, '<r>IT ISN\'T.</r>'], [3.22, 'IN <y>1963,</y>'], [4.74, 'TINO DE ANGELIS'], [5.66, 'BORROWED <g>MILLIONS</g>'],
[6.54, 'AGAINST TANKS LIKE THIS.'], [7.83, 'AMERICAN EXPRESS'], [8.87, 'VOUCHED FOR THE OIL.'], [9.97, 'BANKS HANDED HIM <g>CASH.</g>'], [11.46, 'BUT INSPECTORS'],
[12.34, 'ONLY CHECKED <y>THE TOP.</y>'], [13.72, 'UNDERNEATH?'], [14.58, '<r>WATER.</r>'], [15.23, 'HIDDEN <r>COMPARTMENTS.</r>'], [16.62, 'SECRET <r>PIPES</r>'], [17.5, 'MOVING THE SAME OIL'],
[18.62, 'FROM TANK TO TANK,'], [19.95, 'SO IT GOT COUNTED'], [20.83, '<y>AGAIN AND AGAIN.</y>'], [22.23, 'ON PAPER:'], [23.22, '<g>900,000 TONS.</g>'], [24.93, 'ACTUALLY THERE:'],
[26.05, '<r>55,000.</r>'], [27.5, 'MORE OIL THAN'], [28.54, 'THE WHOLE <y>COUNTRY</y> HAD.'], [29.76, 'THEN THE MARKET'], [30.72, '<r>CRACKED.</r>'], [31.47, '<y>51</y> LENDERS.'],
[32.83, '<r>$180,000,000.</r>'], [35.11, '<r>GONE.</r>'], [35.74, 'HE GOT <y>20 YEARS.</y>'], [37.27, 'WALKED OUT IN <g>7.</g>'], [38.65, 'THE TANKS WERE FULL.'], [40.06, 'JUST NOT OF <r>OIL.</r>'], [42.6, '']];
function caption(c, t) {
  let i = CAPS.findIndex((x, k) => t >= x[0] && t < (CAPS[k + 1] ? CAPS[k + 1][0] : 99)); if (i < 0 || !CAPS[i][1]) return;
  const k = i === 0 ? 1 : eo(lin(t, CAPS[i][0], CAPS[i][0] + .13));
  const parts = []; CAPS[i][1].replace(/<(g|r|y)>(.*?)<\/\1>|([^<]+)/g, (m, tag, inner, plain) => { const col = tag === 'g' ? GREEN : tag === 'r' ? RED : tag === 'y' ? HL : PAPER; for (const w of (inner || plain).split(' ')) if (w) parts.push([w, col]); });
  c.save(); c.font = '800 68px Inter'; const sp = c.measureText(' ').width;
  const lines = [[]]; let lw = 0; for (const p of parts) { const w = c.measureText(p[0]).width; if (lw + w > 600 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([...p, w]); lw += w + sp; }
  const y0 = 1345 - (lines.length - 1) * 40; c.translate(420, y0); c.scale(.8 + .2 * k, .8 + .2 * k); c.globalAlpha = k;
  lines.forEach((ln, li) => { const tw = ln.reduce((a, p) => a + p[2], 0) + sp * (ln.length - 1); let px = -tw / 2;
    for (const [w, col, ww] of ln) { c.textAlign = 'left'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = 'rgba(0,0,0,.85)'; c.lineJoin = 'round'; c.strokeText(w, px, li * 84); c.fillStyle = col; c.fillText(w, px, li * 84); px += ww + sp; } });
  c.restore();
}
function hud(c, t) {
  c.save(); rr(c, 90, 238, 196, 52, 8); c.fillStyle = RED; c.fill(); txt(c, 'DECODED', 188, 265, '800 30px Inter', PAPER);
  txt(c, 'CASE: THE SALAD OIL SWINDLE · 1963', 306, 265, '700 27px JBM', 'rgba(245,243,238,.8)', 'left');
  txt(c, 'DOCUMENTED · DE ANGELIS PLED GUILTY, 1965', 90, 1492, '700 22px JBM', 'rgba(245,243,238,.62)', 'left');
  // case progress ticker
  c.fillStyle = 'rgba(245,243,238,.15)'; c.fillRect(90, 306, 900, 6); c.fillStyle = RED; c.fillRect(90, 306, 900 * t / DUR, 6);
  c.restore();
}
function bgGrid(c, t, tint = 'rgba(255,59,48,.05)') { c.fillStyle = INK; c.fillRect(0, 0, W, H); c.strokeStyle = tint; c.lineWidth = 2; const o = (t * 30) % 90; for (let x = -90 + o; x < W; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); } for (let y = -90 + o; y < H; y += 90) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } }
function vignette(c, a = .7) { const g = c.createRadialGradient(540, 900, 300, 540, 900, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function dust(c, t, n = 40, col = 'rgba(255,220,150,') { for (let i = 0; i < n; i++) { const x = (hash(i) * W + t * (10 + hash(i + 1) * 30)) % W, y = (hash(i + 2) * H - t * (20 + hash(i + 4) * 40) + H * 10) % H; c.fillStyle = col + (0.15 + hash(i + 7) * .35) + ')'; c.beginPath(); c.arc(x, y, 1.5 + hash(i + 3) * 3, 0, 7); c.fill(); } }

// ---------- scenes (local time lt; global t) ----------
function sHook(c, t) { // 0–2.46 golden tank, oil pouring
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a1205'); g.addColorStop(1, '#0B0F14'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.save(); c.translate(540, 820); const z = 1 + t * .05; c.scale(z, z); c.translate(-540, -820);
  // light rays
  c.save(); c.globalAlpha = .18; c.translate(540, 380); c.rotate(t * .15); for (let i = 0; i < 12; i++) { c.rotate(Math.PI / 6); c.fillStyle = HL; c.beginPath(); c.moveTo(0, 0); c.lineTo(-40, -1200); c.lineTo(40, -1200); c.fill(); } c.restore();
  // pour stream
  const sx = 540; c.fillStyle = OIL1; c.fillRect(sx - 14 - Math.sin(t * 9) * 2, 330, 28, 260); c.fillStyle = 'rgba(255,246,208,.6)'; c.fillRect(sx - 4, 330, 6, 260);
  rr(c, 380, 300, 320, 46, 10); c.fillStyle = '#5b6573'; c.fill();
  tank(c, 250, 560, 580, 620, { fill: .55 + t * .14, oil: 1, t, glow: 1, label: '100% SOYBEAN OIL ✓', labelColor: GREEN });
  dust(c, t, 40); c.restore();
  txt(c, 'FULL.', 540, 470 - 0, '400 0px Anton', HL);
}
function sReveal(c, t) { // 2.46–3.22 x-ray: water underneath, FAKE stamp
  const lt = t - 2.46; bgGrid(c, t, 'rgba(43,140,224,.12)');
  c.save(); c.translate(540, 870); const z = 1.08 - lt * .04; c.scale(z, z); c.translate(-540, -870);
  tank(c, 250, 560, 580, 620, { fill: .9, oil: .12, xray: 1, t, label: '≈ WATER', labelColor: RED });
  c.restore();
  // arrows
  c.strokeStyle = RED; c.lineWidth = 8; c.beginPath(); c.moveTo(930, 640); c.lineTo(850, 640); c.stroke(); txt(c, 'OIL', 960, 640, '400 46px Anton', OIL1, 'left');
  c.beginPath(); c.moveTo(930, 950); c.lineTo(850, 950); c.stroke(); txt(c, 'WATER', 905, 1010, '400 46px Anton', WAT1, 'left');
  stamp(c, 'FAKE', 540, 900, 170, RED, -.2, lin(t, 2.72, 2.9));
}
function sCase(c, t) { // 3.22–7.83 year rewind + case file + tank farm with red string
  const lt = t - 3.22; bgGrid(c, t);
  // year rolling back 2026 -> 1963
  const yk = eio(lin(t, 3.3, 4.6)), yr = Math.round(lerp(2026, 1963, yk));
  const ys = lerp(1, .55, eio(lin(t, 4.6, 5.0))), yy = lerp(700, 470, eio(lin(t, 4.6, 5.0)));
  c.save(); c.translate(540, yy); c.scale(ys, ys); c.font = '400 330px Anton'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = yk < 1 ? PAPER : HL; c.fillText(String(yr), Math.sin(t * 40) * (1 - yk) * 8, 0);
  if (yk < 1) { c.globalAlpha = .25; c.fillText(String(yr + 7), 0, -300 * ((t * 6) % 1)); } c.restore();
  // case file folder slides in
  const fk = back(lin(t, 4.7, 5.2));
  if (fk > 0) paper(c, lerp(-500, 330, fk), 820, 460, 560, -.06, (p, w, h) => {
    p.fillStyle = '#d8c79c'; p.fillRect(-w / 2, -h / 2, w, 70); txt(p, 'CASE FILE', -w / 2 + 24, -h / 2 + 37, '400 40px Elite', '#3a2c12', 'left');
    p.fillStyle = '#1c1c1c'; p.beginPath(); p.arc(0, -60, 90, 0, 7); p.fill(); rr(p, -120, 30, 240, 150, 60); p.fill();   // silhouette
    txt(p, '?', 0, -60, '400 110px Anton', '#efe6cf');
    const typed = 'ANTHONY "TINO" DE ANGELIS'.slice(0, Math.floor(lin(t, 5.0, 6.3) * 25));
    txt(p, typed, -w / 2 + 24, 230, '400 30px Elite', '#1c1c1c', 'left');
    txt(p, 'ALLIED CRUDE VEGETABLE OIL', -w / 2 + 24, 266, '400 22px Elite', '#5a4a2a', 'left');
  });
  // tank farm + pin
  const tk = eo(lin(t, 6.4, 7.0));
  for (let i = 0; i < 3; i++) { const sy = lerp(1500, 0, eo(lin(t, 6.4 + i * .12, 7.0 + i * .12))); tank(c, 640 + i * 120 - 40, 700 + sy + i * 40, 150, 260, { fill: .85, oil: 1, t: t + i }); }
  if (tk > 0) { c.globalAlpha = tk; rr(c, 610, 600, 380, 64, 12); c.fillStyle = RED; c.fill(); txt(c, '📍 BAYONNE, N.J.', 800, 633, '800 30px Inter', PAPER); c.globalAlpha = 1; }
  // red string from folder to tanks
  const sk = eio(lin(t, 6.9, 7.6)); if (sk > 0) { c.strokeStyle = RED; c.lineWidth = 6; c.beginPath(); c.moveTo(480, 760); c.quadraticCurveTo(600, 980, lerp(480, 760, sk), lerp(760, 820, sk)); c.stroke(); c.fillStyle = RED; c.beginPath(); c.arc(480, 760, 12, 0, 7); c.fill(); }
}
function sReceipt(c, t) { // 7.83–11.46 warehouse receipt, CERTIFIED stamp, banks shoot cash
  bgGrid(c, t);
  const pk = back(lin(t, 7.85, 8.35)), up = lin(t, 10.0, 10.5);
  paper(c, 540, lerp(1900, 760, pk) - eio(up) * 120, 680, 520, .03, (p, w, h) => {
    txt(p, 'WAREHOUSE RECEIPT', 0, -h / 2 + 60, '400 46px Elite', '#1c1c1c');
    p.fillStyle = '#1c1c1c'; p.fillRect(-w / 2 + 40, -h / 2 + 100, w - 80, 3);
    const lines = ['STORED: SOYBEAN OIL', 'TANK FARM: BAYONNE, N.J.', 'WAREHOUSEMAN:', '  AMERICAN EXPRESS', '  FIELD WAREHOUSING'];
    lines.forEach((s, i) => txt(p, s, -w / 2 + 50, -h / 2 + 150 + i * 46, '400 32px Elite', '#2a2a2a', 'left'));

  if (bk > 0) {
    for (let i = 0; i < 3; i++) bank(c, 230 + i * 310, lerp(1500, 1110, bk), 150, PAPER);
    const ct = t - 10.1; if (ct > 0) for (let i = 0; i < 46; i++) { const s = i * .03, a = ct - s; if (a < 0 || a > 1.4) continue; const src = 230 + (i % 3) * 310; const q = eo(a / 1.1);
      bill(c, lerp(src, 540, q) + Math.sin(i * 7 + a * 6) * 60 * (1 - q), lerp(1060, 520, q), 120, Math.sin(i + a * 8) * 1.2, 1 - lin(a, 1.1, 1.4)); }
  }
}
function sInspect(c, t) { // 11.46–15.23 inspector sees the top; dive under to water
  const dive = eio(lin(t, 13.7, 14.4));
  bgGrid(c, t, 'rgba(255,214,10,.05)');
