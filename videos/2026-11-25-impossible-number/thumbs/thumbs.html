<!doctype html><meta charset="utf-8"><title>thumbs</title>
<body style="margin:0;background:#000">
<canvas id="a" width="1280" height="720"></canvas>
<canvas id="b" width="1280" height="720"></canvas>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../../../brand/storyteller.js"></script>
<script>
const INK='#0B0F14',PAPER='#F5F3EE',GREEN='#00D26A',RED='#FF3B30',YEL='#FFD60A';
const F='node_modules/@fontsource/';
async function loadFonts(){
  const fs=[['Anton','anton/files/anton-latin-400-normal.woff2','400'],['Inter','inter/files/inter-latin-800-normal.woff2','800'],['JetBrains Mono','jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2','800']];
  for(const [n,u,w] of fs){const f=new FontFace(n,`url(${F+u})`,{weight:w});await f.load();document.fonts.add(f);}
}
// Shocked head: draws the stock head, then repaints the face with raised brows, big eyes, open oval mouth.
function shockedHead(c,x,y,r){
  Storyteller.head(c,x,y,r);
  c.save();c.translate(x,y);c.scale(r/78,r/78);
  c.beginPath();c.arc(0,0,69,0,7);c.save();c.clip();
  const hg=c.createRadialGradient(-20,-24,10,0,0,78);hg.addColorStop(0,'#ffe27a');hg.addColorStop(1,'#F2B705');
  c.fillStyle=hg;c.fillRect(-80,-80,160,160);c.restore();
  c.strokeStyle='rgba(138,100,8,.6)';c.lineWidth=3;c.beginPath();c.arc(0,0,62,0,7);c.stroke();
  c.lineCap='round';
  for(const s of [-1,1]){
    c.fillStyle='#fff';c.strokeStyle='#5a3f08';c.lineWidth=2;c.beginPath();c.ellipse(s*25,-10,17,22,0,0,7);c.fill();c.stroke();
    c.fillStyle=INK;c.beginPath();c.arc(s*25+(s<0?4:-0)+1,-8,6,0,7);c.fill();
    c.strokeStyle='#5a3f08';c.lineWidth=7;c.beginPath();c.moveTo(s*12,-50-(s<0?0:4));c.lineTo(s*38,-60+(s<0?4:0));c.stroke();
  }
  c.fillStyle='#3a1a08';c.beginPath();c.ellipse(0,32,16,22,0,0,7);c.fill();
  c.fillStyle='#d9534f';c.beginPath();c.ellipse(0,40,9,9,0,0,7);c.fill();
  c.fillStyle='rgba(255,120,80,.35)';c.beginPath();c.arc(-46,16,9,0,7);c.arc(46,16,9,0,7);c.fill();
  c.restore();
}
function bg(c){c.fillStyle=INK;c.fillRect(0,0,1280,720);
  const g=c.createRadialGradient(900,380,50,900,380,800);g.addColorStop(0,'#16202c');g.addColorStop(1,INK);c.fillStyle=g;c.fillRect(0,0,1280,720);}
function headFx(c,x,y,r,glow){
  const g=c.createRadialGradient(x,y,r*.5,x,y,r*1.9);g.addColorStop(0,glow);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r*2,y-r*2,r*4,r*4);
  c.save();c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=30;c.shadowOffsetY=10;
  c.fillStyle=INK;c.beginPath();c.arc(x,y,r*1.02,0,7);c.fill();c.restore();
  c.save();c.lineWidth=r*.07;c.strokeStyle=PAPER;c.beginPath();c.arc(x,y,r*1.06,0,7);c.stroke();c.restore();
  shockedHead(c,x,y,r);
}
function stamp(c,text,x,y,size,rot,col,opts={}){
  c.save();c.translate(x,y);c.rotate(rot*Math.PI/180);
  c.font=`${size}px Anton`;c.textBaseline='alphabetic';c.textAlign='left';
  const w=c.measureText(text).width,pad=size*.12;
  if(opts.fill){c.fillStyle=INK;c.globalAlpha=.88;c.fillRect(-pad,-size*.92-pad*.4,w+pad*2,size*1.1+pad*.8);c.globalAlpha=1;}
  c.lineWidth=size*.055;c.strokeStyle=col;c.strokeRect(-pad,-size*.92-pad*.4,w+pad*2,size*1.1+pad*.8);
  c.fillStyle=col;c.fillText(text,0,0);c.restore();return w;
}
function A(){
  const c=document.getElementById('a').getContext('2d');bg(c);
  // grid
  c.strokeStyle='rgba(245,243,238,.07)';c.lineWidth=2;
  for(let x=0;x<=1280;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,720);c.stroke();}
  for(let y=0;y<=720;y+=80){c.beginPath();c.moveTo(0,y);c.lineTo(1280,y);c.stroke();}
  // jagged market line
  const pts=[[0,470],[70,430],[120,500],[190,410],[240,520],[310,450],[350,560],[430,470],[480,540],[560,400],[610,500],[700,380],[750,470],[830,360],[880,450],[960,350],[1020,430],[1100,330],[1180,420],[1280,380]];
  c.lineJoin='miter';c.lineCap='round';c.lineWidth=11;
  for(let i=1;i<pts.length;i++){const up=pts[i][1]<pts[i-1][1];c.strokeStyle=up?GREEN:RED;c.shadowColor=up?GREEN:RED;c.shadowBlur=14;c.beginPath();c.moveTo(...pts[i-1]);c.lineTo(...pts[i]);c.stroke();}
  c.shadowBlur=0;
  // ruler-straight 45deg green line
  c.save();c.shadowColor=GREEN;c.shadowBlur=40;c.strokeStyle=GREEN;c.lineWidth=20;c.lineCap='butt';
  c.beginPath();c.moveTo(150,760);c.lineTo(830,80);c.stroke();c.shadowBlur=0;
  c.strokeStyle=PAPER;c.lineWidth=5;c.globalAlpha=.9;c.beginPath();c.moveTo(150,760);c.lineTo(830,80);c.stroke();c.globalAlpha=1;
  // ruler ticks
  c.strokeStyle=INK;c.lineWidth=4;
  for(let i=0;i<26;i++){const t=i/25,px=150+680*t,py=760-680*t;const L=(i%5==0)?22:12;c.beginPath();c.moveTo(px-3,py-3);c.lineTo(px-3-L*.7,py-3-L*-.7+0);c.stroke();}
  c.restore();
  // head
  headFx(c,1040,415,165,'rgba(255,214,10,.28)');
  // text
  c.save();c.font='72px Anton';c.fillStyle=PAPER;c.textAlign='right';c.textBaseline='alphabetic';c.shadowColor='#000';c.shadowBlur=14;
  c.fillText('$65 BILLION',1220,175);c.restore();
  c.save();c.shadowColor='#000';c.shadowBlur=30;stamp(c,'TOO PERFECT',84,222,142,-3,RED,{fill:true});c.restore();
}
function B(){
  const c=document.getElementById('b').getContext('2d');bg(c);
  c.strokeStyle='rgba(245,243,238,.06)';c.lineWidth=2;
  for(let x=0;x<=1280;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,720);c.stroke();}
  for(let y=0;y<=720;y+=80){c.beginPath();c.moveTo(0,y);c.lineTo(1280,y);c.stroke();}
  c.textBaseline='alphabetic';
  c.save();c.shadowColor='rgba(0,210,106,.6)';c.shadowBlur=40;c.fillStyle=GREEN;c.font='340px Anton';c.textAlign='left';c.fillText('123',60,445);c.restore();
  c.save();c.shadowColor='rgba(255,59,48,.6)';c.shadowBlur=40;c.fillStyle=RED;c.font='340px Anton';c.textAlign='left';c.fillText('20',610,445);c.restore();
  c.font='96px Anton';c.fillStyle=YEL;c.textAlign='center';c.fillText('vs',548,315);
  c.font='800 46px "JetBrains Mono"';c.letterSpacing='6px';c.textAlign='center';
  c.fillStyle=PAPER;c.fillText('CLAIMED',275,510);c.fillText('EXISTED',765,510);c.letterSpacing='0px';
  headFx(c,1090,350,125,'rgba(255,214,10,.25)');
  c.save();c.shadowColor='#000';c.shadowBlur=30;stamp(c,'IMPOSSIBLE',90,650,96,-3,RED,{fill:true});c.restore();
}
function C(){
  const c=document.getElementById('c').getContext('2d');bg(c);
  c.strokeStyle='rgba(245,243,238,.06)';c.lineWidth=2;
  for(let x=0;x<=1280;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x,720);c.stroke();}
  for(let y=0;y<=720;y+=80){c.beginPath();c.moveTo(0,y);c.lineTo(1280,y);c.stroke();}
  c.save();c.shadowColor='rgba(255,59,48,.65)';c.shadowBlur=40;c.fillStyle=RED;c.font='340px Anton';c.textAlign='left';c.textBaseline='alphabetic';c.fillText('$65B',56,355);c.restore();
  // calculator bezel
  const x=60,y=395,w=800,h=230;
  c.save();c.shadowColor='#000';c.shadowBlur=30;c.shadowOffsetY=10;c.fillStyle='#2a323d';c.beginPath();c.roundRect(x,y,w,h,26);c.fill();c.restore();
  c.strokeStyle=PAPER;c.lineWidth=6;c.beginPath();c.roundRect(x,y,w,h,26);c.stroke();
  c.fillStyle='#BFE3B4';c.beginPath();c.roundRect(x+22,y+22,w-44,h-44,12);c.fill();
  c.font='800 140px "JetBrains Mono"';c.textAlign='right';c.textBaseline='middle';
  c.fillStyle='rgba(11,15,20,.07)';c.fillText('88888',x+w-44,y+h/2+6);
  c.fillStyle=INK;c.fillText('ERROR',x+w-44,y+h/2+6);
  headFx(c,1070,330,160,'rgba(255,59,48,.22)');
}
(async()=>{await loadFonts();A();B();C();window.READY=true;})();
</script>
