<!doctype html><meta charset="utf-8"><title>thumbs v2</title>
<body style="margin:0;background:#000">
<canvas id="a" width="1280" height="720"></canvas>
<canvas id="b" width="1280" height="720"></canvas>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../../../brand/storyteller.js"></script>
<script>
const INK='#0B0F14',PAPER='#F5F3EE',RED='#FF3B30',GREEN='#00D26A',GOLD='#F2B705';
const PG='#00A152',PR='#E0281E',SUIT='#2c3e66',EDGE='#6f86b8';
const F='node_modules/@fontsource/';
async function loadFonts(){for(const [n,u,w] of [['Anton','anton/files/anton-latin-400-normal.woff2','400'],['JetBrains Mono','jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2','800']]){const f=new FontFace(n,`url(${F+u})`,{weight:w});await f.load();document.fonts.add(f);}}
function shockedHead(c,x,y,r){
  Storyteller.head(c,x,y,r);c.save();c.translate(x,y);c.scale(r/78,r/78);
  c.beginPath();c.arc(0,0,69,0,7);c.save();c.clip();
  const hg=c.createRadialGradient(-20,-24,10,0,0,78);hg.addColorStop(0,'#ffe27a');hg.addColorStop(1,'#F2B705');c.fillStyle=hg;c.fillRect(-80,-80,160,160);c.restore();
  c.strokeStyle='rgba(138,100,8,.6)';c.lineWidth=3;c.beginPath();c.arc(0,0,62,0,7);c.stroke();c.lineCap='round';
  for(const s of [-1,1]){c.fillStyle='#fff';c.strokeStyle='#5a3f08';c.lineWidth=2;c.beginPath();c.ellipse(s*25,-10,17,22,0,0,7);c.fill();c.stroke();
    c.fillStyle=INK;c.beginPath();c.arc(s*25+(s<0?4:0)+1,-8,6,0,7);c.fill();
    c.strokeStyle='#5a3f08';c.lineWidth=7;c.beginPath();c.moveTo(s*12,-50-(s<0?0:4));c.lineTo(s*38,-60+(s<0?4:0));c.stroke();}
  c.fillStyle='#3a1a08';c.beginPath();c.ellipse(0,32,16,22,0,0,7);c.fill();
  c.fillStyle='#d9534f';c.beginPath();c.ellipse(0,40,9,9,0,0,7);c.fill();
  c.fillStyle='rgba(255,120,80,.35)';c.beginPath();c.arc(-46,16,9,0,7);c.arc(46,16,9,0,7);c.fill();c.restore();}
function stage(c){
  c.fillStyle=INK;c.fillRect(0,0,1280,720);
  let g=c.createRadialGradient(420,330,40,420,330,900);g.addColorStop(0,'#2A3647');g.addColorStop(.5,'#161E2A');g.addColorStop(1,INK);c.fillStyle=g;c.fillRect(0,0,1280,720);
  // dot grid
  c.fillStyle='rgba(245,243,238,.075)';for(let x=48;x<1280;x+=96)for(let y=48;y<720;y+=96){c.beginPath();c.arc(x,y,((x-48)/96%4==0&&(y-48)/96%4==0)?4:2.5,0,7);c.fill();}
}
function vignette(c){const g=c.createRadialGradient(640,360,260,640,360,860);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');c.fillStyle=g;c.fillRect(0,0,1280,720);}
function paper(c,x,y,w,h,rot){
  c.save();c.translate(x+w/2,y+h/2);c.rotate(rot*Math.PI/180);c.translate(-w/2,-h/2);
  c.save();c.shadowColor='rgba(2,4,9,.42)';c.shadowBlur=8;c.shadowOffsetX=1.5;c.shadowOffsetY=4;c.fillStyle=PAPER;c.beginPath();c.roundRect(0,0,w,h,16);c.fill();c.restore();
  c.save();c.shadowColor='rgba(2,4,9,.34)';c.shadowBlur=36;c.shadowOffsetX=10;c.shadowOffsetY=20;c.fillStyle=PAPER;c.beginPath();c.roundRect(0,0,w,h,16);c.fill();c.restore();
  const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(120,90,40,.12)');c.fillStyle=g;c.beginPath();c.roundRect(0,0,w,h,16);c.fill();
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();c.roundRect(1,1,w-2,h-2,15);c.stroke();
  return ()=>c.restore();}
function stamp(c,text,cx,cy,size,rot){
  c.save();c.translate(cx,cy);c.rotate(rot*Math.PI/180);c.font=`${size}px Anton`;c.textAlign='center';c.textBaseline='middle';
  const w=c.measureText(text).width+size*.5,h=size*1.2;
  c.save();c.shadowColor='rgba(2,4,9,.45)';c.shadowBlur=30;c.shadowOffsetY=14;c.fillStyle=RED;c.beginPath();c.roundRect(-w/2,-h/2,w,h,10);c.fill();c.restore();
  const g=c.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.3,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=g;c.beginPath();c.roundRect(-w/2,-h/2,w,h,10);c.fill();
  c.strokeStyle=PAPER;c.lineWidth=size*.04;c.beginPath();c.roundRect(-w/2+size*.08,-h/2+size*.08,w-size*.16,h-size*.16,6);c.stroke();
  c.fillStyle=PAPER;c.fillText(text,0,size*.04);c.restore();}
function character(c,x,y,r){
  // shoulders / suit behind head, same palette
  c.save();c.translate(x,y);const k=r/78;c.scale(k,k);
  c.save();c.shadowColor='rgba(2,4,9,.5)';c.shadowBlur=40;c.shadowOffsetY=20;
  c.fillStyle=SUIT;c.strokeStyle=EDGE;c.lineWidth=5;c.beginPath();c.moveTo(-150,260);c.lineTo(-120,110);c.quadraticCurveTo(-100,80,-40,76);c.lineTo(40,76);c.quadraticCurveTo(100,80,120,110);c.lineTo(150,260);c.closePath();c.fill();c.restore();c.stroke();
  c.fillStyle=PAPER;c.beginPath();c.moveTo(-32,76);c.lineTo(32,76);c.lineTo(0,160);c.closePath();c.fill();
  c.fillStyle=RED;c.beginPath();c.moveTo(0,112);c.lineTo(-48,86);c.lineTo(-48,138);c.closePath();c.fill();c.beginPath();c.moveTo(0,112);c.lineTo(48,86);c.lineTo(48,138);c.closePath();c.fill();
  c.fillStyle='#b81f16';c.beginPath();c.arc(0,112,9,0,7);c.fill();c.restore();
  // contact shadow under head
  c.save();c.shadowColor='rgba(2,4,9,.45)';c.shadowBlur=30;c.shadowOffsetY=14;c.fillStyle=GOLD;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();
  shockedHead(c,x,y,r);}
function small(c,txt,x,y,size){c.save();c.font=`${size}px Anton`;c.fillStyle=PAPER;c.textBaseline='alphabetic';c.letterSpacing=size*.06+'px';c.shadowColor='rgba(2,4,9,.6)';c.shadowBlur=6;c.shadowOffsetY=3;c.fillText(txt,x,y);c.restore();}
function A(){const c=document.getElementById('a').getContext('2d');stage(c);
  small(c,'$65 BILLION',54,100,64);
  const col=(x,y,lab,num,tone,rot)=>{const e=paper(c,x,y,350,310,rot);
    c.fillStyle='#59606B';c.font='800 30px "JetBrains Mono"';c.textAlign='left';c.textBaseline='alphabetic';c.letterSpacing='4px';c.fillText(lab,28,64);c.letterSpacing='0px';
    c.strokeStyle='#D8D3C7';c.lineWidth=3;c.setLineDash([10,9]);c.beginPath();c.moveTo(28,84);c.lineTo(322,84);c.stroke();c.setLineDash([]);
    c.fillStyle=tone;c.font='235px Anton';c.textAlign='center';c.fillText(num,175,288);e();};
  col(50,125,'CLAIMED','123',PG,-3);col(430,140,'EXISTED','20',PR,2.5);
  character(c,1030,330,170);
  stamp(c,'IMPOSSIBLE',410,590,145,-5);
  vignette(c);}
function B(){const c=document.getElementById('b').getContext('2d');stage(c);
  small(c,'$65 BILLION',54,100,64);
  const e=paper(c,50,130,770,420,-1.5);
  const L=40,T=40,W=690,H=340; // chart area
  c.strokeStyle='#D8D3C7';c.lineWidth=2;c.setLineDash([8,8]);for(let i=0;i<=4;i++){c.beginPath();c.moveTo(L,T+H*i/4);c.lineTo(L+W,T+H*i/4);c.stroke();}c.setLineDash([]);
  // real wiggly chart (ink), seeded
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;let y=250;c.strokeStyle='#59606B';c.lineWidth=7;c.lineJoin='round';c.lineCap='round';c.beginPath();
  for(let i=0;i<=46;i++){const x=L+W*i/46;y+= -4+ (rnd()-.5)*74;y=Math.max(150,Math.min(330,y));if(i==0)c.moveTo(x,T+y);else c.lineTo(x,T+y);}c.stroke();
  // straight green line
  c.strokeStyle=PG;c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(L,T+260);c.lineTo(L+W,T+30);c.stroke();
  c.fillStyle=PG;c.beginPath();c.arc(L+W,T+30,15,0,7);c.fill();
  e();
  character(c,1030,330,170);
  stamp(c,'TOO PERFECT',470,615,140,-5);
  vignette(c);}

function C(){const c=document.getElementById('c').getContext('2d');stage(c);
  c.textBaseline='alphabetic';c.textAlign='left';
  const T=(t,x,y,sz,col)=>{c.save();c.font=sz+'px Anton';c.fillStyle=col;c.shadowColor='rgba(2,4,9,.6)';c.shadowBlur=8;c.shadowOffsetY=4;c.fillText(t,x,y);c.restore();};
  T('3 FRAUDS',48,200,190,PAPER);T('1 MATH TRICK',48,318,118,GOLD);
  const card=(x,y,w,h,rot,tag,year,icon,srot)=>{const e=paper(c,x,y,w,h,rot);
    c.fillStyle='#59606B';c.font='800 21px "JetBrains Mono"';c.textAlign='left';c.fillText(tag,18,38);
    c.strokeStyle='#D8D3C7';c.lineWidth=3;c.setLineDash([8,7]);c.beginPath();c.moveTo(18,52);c.lineTo(w-18,52);c.stroke();c.setLineDash([]);
    icon(c,w/2,138);
        e();stamp(c,'CAUGHT',x+w/2+8,y+h-60,54,srot);};
  const coupon=(c,x,y)=>{c.save();c.translate(x,y);c.rotate(-.1);c.fillStyle='#E2C48D';c.strokeStyle='#B88700';c.lineWidth=3;c.beginPath();c.roundRect(-70,-38,140,76,8);c.fill();c.stroke();
    c.setLineDash([7,6]);c.strokeStyle='#8a6408';c.beginPath();c.roundRect(-60,-29,120,58,5);c.stroke();c.setLineDash([]);c.fillStyle=PG;c.font='46px Anton';c.textAlign='center';c.fillText('$$$',0,15);c.restore();};
  const tank=(c,x,y)=>{c.save();c.translate(x,y);c.fillStyle='#6f86b8';c.strokeStyle=SUIT;c.lineWidth=4;c.beginPath();c.roundRect(-52,-44,104,88,[16,16,10,10]);c.fill();c.stroke();
    const g=c.createLinearGradient(-52,0,52,0);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=g;c.beginPath();c.roundRect(-52,-44,104,88,[16,16,10,10]);c.fill();
    c.strokeStyle=SUIT;c.lineWidth=3;c.beginPath();c.moveTo(-52,-14);c.lineTo(52,-14);c.moveTo(-52,16);c.lineTo(52,16);c.stroke();
    c.restore();};
  const line=(c,x,y)=>{c.save();c.translate(x,y);c.strokeStyle='#59606B';c.lineWidth=5;c.lineJoin='round';c.beginPath();const w=[-80,-30,-55,-5,-25,25,0,50,30,70];
    c.moveTo(-85,30);[[-65,10],[-48,28],[-28,2],[-10,22],[10,-6],[30,16],[55,-8],[85,8]].forEach(p=>c.lineTo(...p));c.stroke();
    c.strokeStyle=PG;c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(-85,40);c.lineTo(85,-42);c.stroke();c.restore();};
  card(40,372,236,290,-2.5,'PONZI · 1920','1920',coupon,-7);
  card(298,382,236,290,1.5,'SALAD OIL · 1963','1963',tank,5);
  card(556,372,236,290,-1,'MADOFF · 2008','2008',line,-4);
  character(c,1050,330,170);
  vignette(c);}
(async()=>{await loadFonts();A();B();C();window.READY=true;})();
</script>
